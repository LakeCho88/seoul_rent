<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="서울시 2026년 동별·주택유형별 평균 전세가 조회" />
    <title>서울 전세 리포트</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="서울 전세 리포트 홈">
        <span class="brand-mark">S</span>
        <span>서울 전세 리포트</span>
      </a>
      <span class="year-badge">2026 · JEONSE DATA</span>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">SEOUL RENTAL SNAPSHOT</p>
          <h1>동네의 전세 흐름을<br /><em>한눈에</em> 살펴보세요.</h1>
          <p class="intro">서울시 전세 거래를 자치구, 법정동, 주택유형으로 나누어 평균 보증금과 거래 규모를 확인합니다.</p>
        </div>
        <div class="hero-note" aria-label="데이터 설명">
          <span class="note-line"></span>
          <p>서울 열린데이터광장<br /><strong>2026년 전세 거래</strong></p>
        </div>
      </section>

      <section class="report" aria-labelledby="report-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">EXPLORE BY PLACE</p>
            <h2 id="report-title">조건을 선택해 보세요</h2>
          </div>
          <p id="data-status" class="data-status">데이터를 불러오는 중...</p>
        </div>

        <div class="filters">
          <label class="filter-field">
            <span>자치구</span>
            <select id="district-select" disabled>
              <option value="">자치구를 선택하세요</option>
            </select>
          </label>
          <label class="filter-field">
            <span>법정동</span>
            <select id="neighborhood-select" disabled>
              <option value="">먼저 자치구를 선택하세요</option>
            </select>
          </label>
          <label class="filter-field">
            <span>주택유형</span>
            <select id="type-select" disabled>
              <option value="">주택유형을 선택하세요</option>
            </select>
          </label>
        </div>

        <div id="result" class="result-panel empty" aria-live="polite">
          <div class="result-empty">
            <span class="result-icon">⌖</span>
            <p>자치구와 동, 주택유형을 선택하면<br />평균 전세가를 보여드립니다.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>평균 전세가는 보증금 기준이며, 단위는 만원입니다.</p>
      <p class="footer-source">SOURCE · 서울 열린데이터광장</p>
    </footer>
    <script src="app.js" defer></script>
  </body>
</html>
